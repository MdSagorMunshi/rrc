[package]
name = "rrc-kotlin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Kotlin/Android bindings for Radial Response Code (RRC) via UniFFI"

[lib]
name = "uniffi_rrc"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rrc-core = { path = "../rrc-core", version = "0.1.1" }
uniffi = { version = "0.29", default-features = false, features = ["cli"] }
thiserror = "2.0"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
