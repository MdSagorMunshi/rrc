name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 1. Build CLI Binaries across Linux, macOS, and Windows
  build-binaries:
    name: Build CLI for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rrc
            name: rrc-cli-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rrc
            name: rrc-cli-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: rrc
            name: rrc-cli-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rrc.exe
            name: rrc-cli-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release CLI
        run: cargo build --release --target ${{ matrix.target }} -p rrc-cli

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.name }} ${{ matrix.bin }}

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin }} -DestinationPath ../../../${{ matrix.name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # 2. Package C/C++ SDK
  build-cpp-sdk:
    name: Package C/C++ SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build rrc-cpp
        run: cargo build --release -p rrc-cpp

      - name: Create C/C++ SDK Archive
        run: |
          mkdir -p rrc-cpp-sdk/include rrc-cpp-sdk/lib
          cp crates/rrc-cpp/include/rrc.h rrc-cpp-sdk/include/
          cp crates/rrc-cpp/CMakeLists.txt rrc-cpp-sdk/
          cp target/release/librrc_cpp.a rrc-cpp-sdk/lib/
          cp target/release/librrc_cpp.so rrc-cpp-sdk/lib/
          tar -czvf rrc-cpp-sdk-linux-x86_64.tar.gz rrc-cpp-sdk/

      - name: Upload C/C++ SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rrc-cpp-sdk-linux-x86_64.tar.gz
          path: rrc-cpp-sdk-linux-x86_64.tar.gz

  # 3. Publish to crates.io
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish rrc-core to crates.io
        if: env.CRATES_IO_TOKEN != ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
          cargo publish -p rrc-core

      - name: Wait for rrc-core to index
        if: env.CRATES_IO_TOKEN != ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: sleep 25

      - name: Publish rrc-cli to crates.io
        if: env.CRATES_IO_TOKEN != ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p rrc-cli

  # 4. Build and Publish Node.js N-API Package to npm
  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        working-directory: crates/rrc-node
        run: npm install

      - name: Build native addon
        working-directory: crates/rrc-node
        run: npm run build

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: crates/rrc-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # 5. Create GitHub Release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-cpp-sdk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
